<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Criptográfico Clásico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-accent: #38bdf8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        }

        .crypto-container {
            background-color: var(--panel-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            max-width: 650px;
            width: 100%;
            backdrop-filter: blur(10px);
            opacity: 0;
            /* Inicia oculto para la animación de GSAP */
            transform: translateY(30px);
        }

        h1 {
            text-align: center;
            color: var(--text-accent);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            transition: border-color 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--text-accent);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .flex-row {
            display: flex;
            gap: 15px;
        }

        .flex-row .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--text-accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        #outputText {
            background-color: rgba(15, 23, 42, 0.5);
            border-color: var(--text-accent);
        }

        #bruteForceResults {
            display: none;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            background-color: rgba(15, 23, 42, 0.5);
        }

        #bruteForceResults::-webkit-scrollbar {
            width: 8px;
        }

        #bruteForceResults::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .bf-entry {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .bf-entry:hover {
            border-color: var(--border-color);
        }

        .bf-entry.bf-best {
            border-color: #22c55e;
            background-color: rgba(34, 197, 94, 0.1);
        }

        .bf-entry .bf-k {
            color: var(--text-accent);
            font-weight: bold;
            margin-right: 10px;
        }

        .bf-entry .bf-score {
            color: #94a3b8;
            font-size: 11px;
            float: right;
        }

        .bf-entry.bf-best .bf-score {
            color: #22c55e;
        }

        #detectedK {
            display: none;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 8px;
            color: #22c55e;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="crypto-container" id="mainContainer">
        <h1>Terminal Criptográfica</h1>

        <div class="input-group">
            <label for="alphabet">Conjunto de Caracteres (Base de indexación):</label>
            <input type="text" id="alphabet"
                value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?">
        </div>

        <div class="flex-row">
            <div class="input-group">
                <label for="cipherType">Algoritmo:</label>
                <select id="cipherType">
                    <option value="cesar">César (Desplazamiento)</option>
                    <option value="atbash">Atbash (Espejo)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="mode">Modo Operativo:</label>
                <select id="mode" onchange="onModeChange()">
                    <option value="cifrar">Cifrar</option>
                    <option value="descifrar">Descifrar</option>
                    <option value="auto">Auto-descifrar (Fuerza Bruta)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="module">Módulo (César):</label>
                <input type="number" id="module" value="3">
            </div>
        </div>

        <div class="input-group">
            <label for="inputText">Cadena de Entrada:</label>
            <textarea id="inputText" placeholder=">_ Ingresa los datos aquí..."></textarea>
        </div>

        <button id="execBtn" onclick="runCryptoEngine()">Ejecutar Algoritmo</button>

        <div id="detectedK"></div>

        <div class="input-group">
            <label for="outputText">Salida Procesada:</label>
            <textarea id="outputText" readonly placeholder=">_ Esperando procesamiento..."></textarea>
        </div>

        <div id="bruteForceResults">
            <label>Todos los desplazamientos probados:</label>
        </div>
    </div>

    <script>
        // Animación de entrada al cargar la página usando GSAP
        gsap.to("#mainContainer", {
            duration: 1,
            opacity: 1,
            y: 0,
            ease: "power3.out"
        });

        // Diccionario de palabras comunes en español para detección
        const DICTIONARY = new Set([
            // Artículos y preposiciones
            "el", "la", "los", "las", "un", "una", "unos", "unas",
            "de", "del", "en", "con", "por", "para", "sin", "sobre",
            "a", "al", "y", "o", "e", "u", "ni", "que", "se",
            // Pronombres
            "yo", "tu", "el", "ella", "nosotros", "ellos", "ellas",
            "me", "te", "le", "nos", "les", "lo", "mi", "ti", "si",
            "este", "esta", "esto", "estos", "estas", "ese", "esa",
            // Verbos comunes
            "es", "ser", "soy", "eres", "son", "somos", "era", "fue",
            "estar", "estoy", "estas", "esta", "estamos", "estan",
            "hay", "tiene", "tiene", "tener", "tengo", "tienes", "tenemos",
            "hacer", "hago", "hace", "hacemos", "hacen", "hizo",
            "ir", "voy", "vas", "va", "vamos", "van", "fue", "iba",
            "poder", "puede", "puedo", "puedes", "pueden", "podemos",
            "decir", "dice", "digo", "dices", "dicen", "dijo",
            "dar", "doy", "das", "da", "dan", "damos", "dio",
            "saber", "se", "sabes", "sabe", "sabemos", "saben",
            "querer", "quiero", "quieres", "quiere", "queremos", "quieren",
            "ver", "veo", "ves", "ve", "vemos", "ven", "vio",
            "creo", "cree", "poner", "pone", "pongo",
            "venir", "viene", "vengo", "vienes", "vienen",
            "salir", "sale", "salgo", "sales", "salen",
            // Sustantivos comunes
            "hola", "mundo", "casa", "tiempo", "vida", "dia", "hombre",
            "mujer", "parte", "mundo", "cosa", "gobierno", "pais",
            "lugar", "caso", "trabajo", "punto", "mano", "agua",
            "nombre", "ciudad", "familia", "noche", "hijo", "grupo",
            "problema", "pueblo", "persona", "momento", "forma",
            "historia", "palabra", "libro", "ejemplo", "muerte",
            "programa", "sistema", "juego", "clase", "numero",
            "mensaje", "texto", "codigo", "clave", "cifrado",
            "amigo", "amiga", "escuela", "dinero", "comida",
            "perro", "gato", "carro", "coche", "mesa", "puerta",
            // Adjetivos comunes
            "bueno", "buena", "malo", "mala", "grande", "nuevo", "nueva",
            "primer", "primera", "ultimo", "ultima", "mejor", "peor",
            "mismo", "misma", "otro", "otra", "poco", "poca",
            "mucho", "mucha", "todo", "toda", "todos", "todas",
            "bien", "mal", "mas", "menos", "muy", "ya", "tambien",
            // Adverbios y conectores
            "no", "si", "como", "pero", "cuando", "donde", "porque",
            "entre", "hasta", "desde", "despues", "antes", "ahora",
            "hoy", "aqui", "asi", "solo", "siempre", "nunca",
            "nada", "algo", "alguien", "nadie", "cada",
            // Saludos y expresiones
            "buenos", "dias", "tardes", "noches", "gracias",
            "adios", "chau", "bienvenido", "feliz", "cumple",
            // Números escritos
            "cero", "uno", "dos", "tres", "cuatro", "cinco",
            "seis", "siete", "ocho", "nueve", "diez",
            // Inglés básico (textos mixtos)
            "the", "be", "to", "of", "and", "in", "that", "have",
            "it", "for", "not", "on", "with", "he", "as", "you",
            "do", "at", "this", "but", "his", "by", "from", "they",
            "we", "say", "her", "she", "or", "an", "will", "my",
            "all", "would", "there", "their", "what", "so", "up",
            "out", "if", "about", "who", "get", "which", "go", "me",
            "when", "make", "can", "like", "time", "no", "just",
            "him", "know", "take", "people", "into", "year", "your",
            "good", "some", "could", "them", "see", "other", "than",
            "then", "now", "look", "only", "come", "its", "over",
            "hello", "world", "how", "are", "is", "was", "were",
            "been", "has", "had", "did", "does", "will", "shall"
        ]);

        function decryptWithShift(text, alphabet, shift) {
            let result = "";
            for (let i = 0; i < text.length; i++) {
                let index = alphabet.indexOf(text[i]);
                if (index === -1) {
                    result += text[i];
                    continue;
                }
                let newIndex = (index - shift) % alphabet.length;
                if (newIndex < 0) newIndex += alphabet.length;
                result += alphabet[newIndex];
            }
            return result;
        }

        function scoreText(text) {
            // Normalizar: minúsculas, quitar acentos
            const normalized = text.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            // Extraer palabras (separar por cualquier cosa que no sea letra)
            const words = normalized.match(/[a-z]+/g);
            if (!words || words.length === 0) return 0;

            let score = 0;
            let matchedChars = 0;
            const totalChars = normalized.replace(/[^a-z]/g, "").length || 1;

            for (const word of words) {
                if (DICTIONARY.has(word)) {
                    // Palabras más largas valen más (evita falsos positivos con "a", "o")
                    const wordScore = word.length <= 2 ? 1 : word.length * 2;
                    score += wordScore;
                    matchedChars += word.length;
                }
            }

            // Bonus por porcentaje de texto reconocido como palabras reales
            const coverage = matchedChars / totalChars;
            score += coverage * 50;

            return score;
        }

        function onModeChange() {
            const mode = document.getElementById("mode").value;
            const moduleInput = document.getElementById("module");
            const cipherType = document.getElementById("cipherType").value;

            if (mode === "auto") {
                moduleInput.disabled = true;
                moduleInput.value = "—";
                if (cipherType !== "cesar") {
                    document.getElementById("cipherType").value = "cesar";
                }
            } else {
                moduleInput.disabled = false;
                if (moduleInput.value === "—") moduleInput.value = "3";
            }
        }

        function runCryptoEngine() {
            // [REF-TIPO-1]
            const text = document.getElementById("inputText").value;
            const alphabet = document.getElementById("alphabet").value;
            const cipherType = document.getElementById("cipherType").value;
            const mode = document.getElementById("mode").value;
            const isDecrypt = mode === "descifrar";
            const isAuto = mode === "auto";
            const moduleShift = parseInt(document.getElementById("module").value) || 0;

            const outputBox = document.getElementById("outputText");
            const detectedKBox = document.getElementById("detectedK");
            const bfPanel = document.getElementById("bruteForceResults");

            // Limpiar estado previo
            detectedKBox.style.display = "none";
            bfPanel.style.display = "none";

            if (isAuto && cipherType === "cesar") {
                // Fuerza bruta: probar todos los K posibles
                let bestScore = -1;
                let bestK = 0;
                let bestResult = "";
                const attempts = [];

                for (let k = 0; k < alphabet.length; k++) {
                    const decrypted = decryptWithShift(text, alphabet, k);
                    const score = scoreText(decrypted);
                    attempts.push({ k, decrypted, score });
                    if (score > bestScore) {
                        bestScore = score;
                        bestK = k;
                        bestResult = decrypted;
                    }
                }

                // Mostrar resultado ganador
                outputBox.value = bestResult;
                const confidence = bestScore > 0 ? "palabras reconocidas" : "sin coincidencias claras";
                detectedKBox.textContent = `K detectado: ${bestK} — ${confidence}`;
                detectedKBox.style.display = "block";

                // Mostrar todos los intentos ordenados por score
                const sorted = [...attempts].sort((a, b) => b.score - a.score);
                let html = "<label>Todos los desplazamientos probados:</label>";
                for (const att of sorted) {
                    const isBest = att.k === bestK ? "bf-best" : "";
                    const preview = att.decrypted.length > 80
                        ? att.decrypted.substring(0, 80) + "…"
                        : att.decrypted;
                    html += `<div class="bf-entry ${isBest}">` +
                        `<span class="bf-k">K=${att.k}</span>` +
                        `${preview}` +
                        `<span class="bf-score">score: ${att.score.toFixed(1)}</span>` +
                        `</div>`;
                }
                bfPanel.innerHTML = html;
                bfPanel.style.display = "block";

                // Animaciones
                gsap.fromTo(detectedKBox,
                    { opacity: 0, y: -10 },
                    { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }
                );
                gsap.fromTo(bfPanel,
                    { opacity: 0 },
                    { opacity: 1, duration: 0.6, ease: "power2.out", delay: 0.2 }
                );

            } else {
                // Cifrado/descifrado normal
                let result = "";

                // [REF-TIPO-2]
                for (let i = 0; i < text.length; i++) {
                    let char = text[i];
                    let index = alphabet.indexOf(char);

                    // [REF-TIPO-3]
                    if (index === -1) {
                        result += char;
                        continue;
                    }

                    if (cipherType === "cesar") {
                        // [REF-TIPO-4]
                        let shift = isDecrypt ? -moduleShift : moduleShift;
                        let newIndex = (index + shift) % alphabet.length;

                        if (newIndex < 0) {
                            newIndex += alphabet.length;
                        }
                        result += alphabet[newIndex];

                    } else if (cipherType === "atbash") {
                        // [REF-TIPO-5]
                        let newIndex = (alphabet.length - 1) - index;
                        result += alphabet[newIndex];
                    }
                }

                outputBox.value = result;
            }

            // Animación GSAP para feedback visual al usuario
            gsap.fromTo(outputBox,
                { backgroundColor: "rgba(56, 189, 248, 0.3)" },
                { backgroundColor: "rgba(15, 23, 42, 0.5)", duration: 1, ease: "power2.out" }
            );

            // Animación de rebote sutil en el botón
            gsap.fromTo("#execBtn",
                { scale: 0.95 },
                { scale: 1, duration: 0.3, ease: "back.out(1.7)" }
            );
        }
    </script>

</body>

</html>
